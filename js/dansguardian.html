<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acesso Bloqueado</title>
  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px;
    }
    .box {
      background-color: white;
      border-radius: 10px;
      padding: 40px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    h1 {
      color: #d9534f;
    }
    p {
      font-size: 18px;
      color: #333;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ACESSO BLOQUEADO</h1>
    <p>O acesso ao site solicitado foi bloqueado pelas políticas da rede.</p>
    <p><strong>Categoria:</strong> [category]</p>
    <p><strong>Endereço:</strong> [url]</p>
    <div class="footer">
      <p>Se você acredita que isso é um erro, entre em contato com o administrador da rede.</p>
      <p>© 2025 Escola Técnica | Sistema de Filtragem BrazilFW + DansGuardian</p>
    </div>
  </div>
</body>
</html>
